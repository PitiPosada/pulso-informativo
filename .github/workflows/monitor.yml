name: Monitor de noticias

# Monitorea fuentes RSS cada 20 min y notifica a Telegram.
on:
  schedule:
    # cada 20 minutos (levantado por GitHub en UTC)
    - cron: "*/20 * * * *"
  workflow_dispatch: # para probarlo a mano desde la pestaña Actions

permissions:
  contents: write # para poder commitar la base de datos con el estado actualizado

concurrency:
  group: monitor-noticias
  cancel-in-progress: false # evita que dos ciclos se pisen el dedup

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio (trae la base de datos actual)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar un ciclo de monitoreo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_UNA_VEZ: "1"
        run: python monitor.py

      - name: Commit de la base de datos actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulso_informativo.db
          if git diff --cached --quiet; then
            echo "Sin cambios en la base de datos"
          else
            git commit -m "Actualiza base de datos del monitor"
            git push
          fi